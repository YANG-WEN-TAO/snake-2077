<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SNAKE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #050a0f;
    --grid: #0a1520;
    --accent: #00ffe7;
    --accent2: #ff2d6b;
    --accent3: #f0e040;
    --snake-head: #00ffe7;
    --snake-body: #00b8a6;
    --food: #ff2d6b;
    --glow: 0 0 10px #00ffe7, 0 0 30px #00ffe780, 0 0 60px #00ffe740;
    --glow2: 0 0 10px #ff2d6b, 0 0 30px #ff2d6b80;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Orbitron', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    color: var(--accent);
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,231,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,231,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridPulse 4s ease-in-out infinite;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, #050a0f 100%);
    z-index: 1;
    pointer-events: none;
  }

  @keyframes gridPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .wrapper {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* Title */
  .title {
    font-size: 2.8rem;
    font-weight: 900;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-shadow: var(--glow);
    animation: titlePulse 2s ease-in-out infinite;
    text-transform: uppercase;
  }

  .title span {
    color: var(--accent2);
    text-shadow: var(--glow2);
  }

  @keyframes titlePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
  }

  /* Score board */
  .scoreboard {
    display: flex;
    gap: 40px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    color: #ffffff80;
  }

  .score-item label {
    display: block;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-bottom: 2px;
    opacity: 0.7;
  }

  .score-item .value {
    font-size: 1.5rem;
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 10px rgba(0,255,231,0.5);
  }

  /* Game canvas container */
  .canvas-container {
    position: relative;
    border: 1px solid #00ffe730;
    box-shadow:
      0 0 0 1px #00ffe710,
      0 0 30px #00ffe720,
      0 0 80px #00ffe710,
      inset 0 0 30px #00000080;
    border-radius: 4px;
    overflow: hidden;
  }

  /* Corner decorations */
  .canvas-container::before,
  .canvas-container::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    z-index: 10;
    pointer-events: none;
  }

  .canvas-container::before {
    top: -1px; left: -1px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
    box-shadow: -3px -3px 8px var(--accent);
  }

  .canvas-container::after {
    bottom: -1px; right: -1px;
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
    box-shadow: 3px 3px 8px var(--accent);
  }

  canvas {
    display: block;
    image-rendering: pixelated;
  }

  /* Overlay screens */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5,10,15,0.92);
    backdrop-filter: blur(4px);
    z-index: 20;
    gap: 16px;
    opacity: 1;
    transition: opacity 0.3s;
  }

  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .overlay-title {
    font-size: 1.4rem;
    font-weight: 900;
    letter-spacing: 0.25em;
    color: var(--accent2);
    text-shadow: var(--glow2);
    text-transform: uppercase;
  }

  .overlay-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    color: #ffffff60;
    text-transform: uppercase;
  }

  .overlay-score {
    font-size: 3rem;
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.1em;
    text-shadow: 0 0 20px var(--accent);
    margin: 4px 0;
  }

  .btn {
    margin-top: 12px;
    padding: 12px 36px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Orbitron', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.3em;
    cursor: pointer;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
    transition: color 0.3s, box-shadow 0.3s;
    box-shadow: 0 0 10px #00ffe740;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    transform: translateX(-101%);
    transition: transform 0.3s;
    z-index: -1;
  }

  .btn:hover {
    color: #050a0f;
    box-shadow: var(--glow);
  }

  .btn:hover::before {
    transform: translateX(0);
  }

  /* Controls hint */
  .controls {
    display: flex;
    gap: 16px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    color: #ffffff30;
    text-transform: uppercase;
    align-items: center;
  }

  .controls .key {
    display: inline-block;
    padding: 2px 7px;
    border: 1px solid #ffffff20;
    border-radius: 2px;
    color: #ffffff50;
    margin: 0 2px;
  }

  /* Speed indicator */
  .speed-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: #ffffff30;
    text-transform: uppercase;
  }

  .speed-dots {
    display: flex;
    gap: 4px;
  }

  .speed-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffffff15;
    transition: background 0.3s, box-shadow 0.3s;
  }

  .speed-dot.active {
    background: var(--accent3);
    box-shadow: 0 0 6px var(--accent3);
  }

  /* Scanline effect */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 5;
  }

  /* Flicker on eat */
  @keyframes flashEat {
    0% { box-shadow: 0 0 0 1px #00ffe710, 0 0 30px #ff2d6b60, 0 0 80px #ff2d6b30, inset 0 0 30px #00000080; }
    100% { box-shadow: 0 0 0 1px #00ffe710, 0 0 30px #00ffe720, 0 0 80px #00ffe710, inset 0 0 30px #00000080; }
  }

  .flash {
    animation: flashEat 0.3s ease-out;
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="title">NEON <span>SNAKE</span></div>

  <div class="scoreboard">
    <div class="score-item">
      <label>SCORE</label>
      <div class="value" id="score">0</div>
    </div>
    <div class="score-item">
      <label>BEST</label>
      <div class="value" id="best">0</div>
    </div>
    <div class="score-item">
      <label>LENGTH</label>
      <div class="value" id="length">1</div>
    </div>
  </div>

  <div class="canvas-container" id="canvasContainer">
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <div class="scanlines"></div>

    <!-- Start screen -->
    <div class="overlay" id="startScreen">
      <div class="overlay-title">READY</div>
      <div class="overlay-sub">Navigate the neon serpent</div>
      <button class="btn" id="startBtn">INITIATE</button>
    </div>

    <!-- Game over screen -->
    <div class="overlay hidden" id="gameOverScreen">
      <div class="overlay-title">SYSTEM CRASH</div>
      <div class="overlay-sub">Final Score</div>
      <div class="overlay-score" id="finalScore">0</div>
      <button class="btn" id="restartBtn">REBOOT</button>
    </div>
  </div>

  <div class="speed-bar">
    <span>SPEED</span>
    <div class="speed-dots" id="speedDots">
      <div class="speed-dot active"></div>
      <div class="speed-dot"></div>
      <div class="speed-dot"></div>
      <div class="speed-dot"></div>
      <div class="speed-dot"></div>
    </div>
  </div>

  <div class="controls">
    <span><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> or</span>
    <span><span class="key">Arrow Keys</span> to move</span>
    <span><span class="key">P</span> pause</span>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const COLS = 25, ROWS = 25;
  const CELL = canvas.width / COLS;

  let snake, dir, nextDir, food, score, best, gameLoop, running, paused, ateFood;

  // Color config
  const COLORS = {
    bg: '#050a0f',
    grid: '#0a1520',
    head: '#00ffe7',
    body: ['#00ffe7', '#00e6d0', '#00ccba', '#00b3a4', '#009990'],
    food: '#ff2d6b',
    foodGlow: '#ff2d6b',
    particle: '#ff2d6b',
  };

  let particles = [];

  function lerp(a, b, t) { return a + (b - a) * t; }

  function initGame() {
    const mid = Math.floor(COLS / 2);
    snake = [
      { x: mid, y: mid },
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    ateFood = false;
    particles = [];
    updateUI();
    placeFood();
  }

  function placeFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function updateUI() {
    document.getElementById('score').textContent = score;
    document.getElementById('length').textContent = snake.length;
    const savedBest = parseInt(localStorage.getItem('snakeBest') || '0');
    best = Math.max(score, savedBest);
    document.getElementById('best').textContent = best;
    updateSpeedDots();
  }

  function getSpeed() {
    if (score < 30) return 130;
    if (score < 80) return 100;
    if (score < 150) return 75;
    if (score < 250) return 55;
    return 40;
  }

  function getSpeedLevel() {
    if (score < 30) return 1;
    if (score < 80) return 2;
    if (score < 150) return 3;
    if (score < 250) return 4;
    return 5;
  }

  function updateSpeedDots() {
    const level = getSpeedLevel();
    document.querySelectorAll('.speed-dot').forEach((d, i) => {
      d.classList.toggle('active', i < level);
    });
  }

  // Particle system
  function spawnParticles(x, y) {
    for (let i = 0; i < 12; i++) {
      const angle = (Math.PI * 2 / 12) * i + Math.random() * 0.5;
      const speed = 1.5 + Math.random() * 3;
      particles.push({
        x: (x + 0.5) * CELL,
        y: (y + 0.5) * CELL,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        size: 2 + Math.random() * 3,
      });
    }
  }

  function updateParticles() {
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.92;
      p.vy *= 0.92;
      p.life -= 0.04;
      p.size *= 0.96;
    });
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = COLORS.particle;
      ctx.shadowColor = COLORS.particle;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  // Food pulse animation
  let foodPulse = 0;

  function draw() {
    foodPulse += 0.08;

    // Background
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
    }
    for (let j = 0; j <= ROWS; j++) {
      ctx.beginPath();
      ctx.moveTo(0, j * CELL);
      ctx.lineTo(canvas.width, j * CELL);
      ctx.stroke();
    }

    // Food
    const pulse = 0.5 + 0.5 * Math.sin(foodPulse);
    const fx = (food.x + 0.5) * CELL;
    const fy = (food.y + 0.5) * CELL;
    const fr = CELL * 0.35 * (0.85 + 0.15 * pulse);

    // Food glow
    const foodGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr * 2);
    foodGrad.addColorStop(0, '#ff2d6bcc');
    foodGrad.addColorStop(1, '#ff2d6b00');
    ctx.fillStyle = foodGrad;
    ctx.beginPath();
    ctx.arc(fx, fy, fr * 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.shadowColor = COLORS.foodGlow;
    ctx.shadowBlur = 18 + 8 * pulse;
    ctx.fillStyle = COLORS.food;
    ctx.beginPath();
    ctx.arc(fx, fy, fr, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Snake body (draw tail to head)
    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const t = i / (snake.length - 1 || 1);
      const isHead = i === 0;

      const px = seg.x * CELL + 2;
      const py = seg.y * CELL + 2;
      const pw = CELL - 4;
      const ph = CELL - 4;
      const radius = isHead ? 5 : 3;

      // Glow for head
      if (isHead) {
        ctx.save();
        ctx.shadowColor = COLORS.head;
        ctx.shadowBlur = 20;
      }

      // Gradient color along body
      const alpha = lerp(1, 0.4, t);
      const green = Math.floor(lerp(255, 140, t));
      ctx.fillStyle = isHead
        ? COLORS.head
        : `rgba(0, ${green}, ${Math.floor(lerp(231, 120, t))}, ${alpha})`;

      // Rounded rectangle
      ctx.beginPath();
      ctx.roundRect(px, py, pw, ph, radius);
      ctx.fill();

      if (isHead) {
        ctx.restore();
        // Eyes
        const eyeOffset = CELL * 0.22;
        const eyeForward = CELL * 0.15;
        let ex1, ey1, ex2, ey2;
        const cx2 = seg.x * CELL + CELL / 2;
        const cy2 = seg.y * CELL + CELL / 2;

        if (dir.x === 1) { // right
          ex1 = cx2 + eyeForward; ey1 = cy2 - eyeOffset;
          ex2 = cx2 + eyeForward; ey2 = cy2 + eyeOffset;
        } else if (dir.x === -1) { // left
          ex1 = cx2 - eyeForward; ey1 = cy2 - eyeOffset;
          ex2 = cx2 - eyeForward; ey2 = cy2 + eyeOffset;
        } else if (dir.y === -1) { // up
          ex1 = cx2 - eyeOffset; ey1 = cy2 - eyeForward;
          ex2 = cx2 + eyeOffset; ey2 = cy2 - eyeForward;
        } else { // down
          ex1 = cx2 - eyeOffset; ey1 = cy2 + eyeForward;
          ex2 = cx2 + eyeOffset; ey2 = cy2 + eyeForward;
        }

        ctx.save();
        ctx.shadowColor = '#050a0f';
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#050a0f';
        ctx.beginPath(); ctx.arc(ex1, ey1, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex2, ey2, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }

    // Particles
    drawParticles();
  }

  function step() {
    if (!running || paused) return;

    dir = { ...nextDir };
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      endGame(); return;
    }
    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame(); return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      spawnParticles(food.x, food.y);
      flashCanvas();
      updateUI();
      localStorage.setItem('snakeBest', best);
      placeFood();
    } else {
      snake.pop();
    }

    updateParticles();
    draw();

    // Schedule next frame based on score/speed
    clearTimeout(gameLoop);
    gameLoop = setTimeout(step, getSpeed());
  }

  function flashCanvas() {
    const container = document.getElementById('canvasContainer');
    container.classList.remove('flash');
    void container.offsetWidth;
    container.classList.add('flash');
  }

  function endGame() {
    running = false;
    clearTimeout(gameLoop);
    const finalScore = document.getElementById('finalScore');
    finalScore.textContent = score;
    document.getElementById('gameOverScreen').classList.remove('hidden');
    // Death animation - flicker
    let flickers = 0;
    const flicker = setInterval(() => {
      canvas.style.opacity = canvas.style.opacity === '0.2' ? '1' : '0.2';
      flickers++;
      if (flickers > 6) {
        clearInterval(flicker);
        canvas.style.opacity = '1';
      }
    }, 80);
  }

  function startGame() {
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    initGame();
    running = true;
    paused = false;
    step();
  }

  // Controls
  document.addEventListener('keydown', (e) => {
    const map = {
      ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 }, S: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }, D: { x: 1, y: 0 },
    };

    if (map[e.key]) {
      const nd = map[e.key];
      // Prevent reversing
      if (nd.x !== -dir.x || nd.y !== -dir.y) {
        nextDir = nd;
      }
      e.preventDefault();
    }

    if ((e.key === 'p' || e.key === 'P') && running) {
      paused = !paused;
      if (!paused) step();
    }
  });

  // Touch/swipe support
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      const nd = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
      if (nd.x !== -dir.x) nextDir = nd;
    } else {
      const nd = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
      if (nd.y !== -dir.y) nextDir = nd;
    }
    touchStart = null;
    e.preventDefault();
  }, { passive: false });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  // Initial draw
  initGame();
  draw();
</script>
</body>
</html>
